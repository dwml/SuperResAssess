[tool.poetry]
name = "superresassess"
version = "0.1.0"
description = "The code for a study on the assessment of super-resolution for brain MRI"
authors = ["dirk <dirk.loeffen@radboudumc.nl>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.8.1"
monai = "^1.3.1"
lightning = "^2.3.0"
pydantic = "^2.7.4"
boto3 = "^1.34.130"
ruff = "^0.4.10"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-cov = "^5.0.0"
flake8 = "^7.1.0"
black = "^24.4.2"
flake8-pyproject = "^1.2.3"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.flake8]
max-line-length = 88

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

