[tool.poetry]
name = "superresassess"
version = "0.1.0"
description = "The code for a study on the assessment of super-resolution for brain MRI"
authors = ["dirk <dirk.loeffen@radboudumc.nl>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
monai = "^1.3.1"
lightning = "^2.3.0"
pydantic = "^2.7.4"
boto3 = "^1.34.130"
itk = "^5.4.0"
nibabel = "^5.2.1"
numpy = "<2.0"
pandas = "^2.2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-cov = "^5.0.0"
ruff = "^0.5.4"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "s3: marks tests that need aws s3 credentials (deselect with '-m \"not s3\"')",
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black 
line-length = 88
indent-width = 4

# Assume python 
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "C", "Q"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

